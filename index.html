<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- ===== HEADER: jam, tanggal, sapaan ===== -->
    <header class="card header-card">
      <button id="themeToggle" class="theme-toggle" title="Ganti tema">🌙</button>

      <div id="clock" class="clock">00:00:00</div>
      <div id="dateText" class="date-text">Loading...</div>

      <div class="greeting-row">
        <h1 id="greeting">Halo!</h1>
        <button id="editNameBtn" class="link-btn">✏️ Ganti nama</button>
      </div>
    </header>

    <!-- ===== GRID: Timer, Tasks, Quick Links ===== -->
    <div class="grid">

      <!-- Focus Timer -->
      <section class="card">
        <h2>Focus Timer</h2>

        <div class="timer-display" id="timerDisplay">25:00</div>

        <div class="timer-buttons">
          <button id="startBtn">Start</button>
          <button id="stopBtn">Stop</button>
          <button id="resetBtn">Reset</button>
        </div>

        <div class="timer-settings">
          <label for="timerMinutes">Durasi (menit):</label>
          <input type="number" id="timerMinutes" min="1" max="120" value="25" />
          <button id="applyMinutesBtn">Terapkan</button>
        </div>
      </section>

      <!-- Tasks -->
      <section class="card">
        <h2>Tasks</h2>

        <form id="taskForm" class="task-form">
          <input type="text" id="taskInput" placeholder="Tambah tugas baru..." autocomplete="off" />
          <button type="submit">Add</button>
        </form>

        <ul id="taskList" class="task-list"></ul>
      </section>

      <!-- Quick Links -->
      <section class="card">
        <h2>Quick Links</h2>

        <form id="linkForm" class="link-form">
          <input type="text" id="linkName" placeholder="Nama link" autocomplete="off" />
          <input type="url" id="linkUrl" placeholder="https://..." autocomplete="off" />
          <button type="submit">Add Link</button>
        </form>

        <div id="linkList" class="link-list"></div>
      </section>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
